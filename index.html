<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lámpara cubo mena de diamante</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{touch-action:none;-webkit-user-select:none;user-select:none;background:#1a1156 url(fondo.jpg) center/cover no-repeat;overflow:hidden;font-family:Arial,Helvetica,sans-serif;position:relative}
:root{--glow:#3fd8ff;--glow2:#1a9bff;--body:#0b1226}
.halo{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px;background:radial-gradient(circle,rgba(40,140,255,.38),rgba(20,60,200,.14) 45%,transparent 70%);pointer-events:none}
.scene{position:absolute;left:50%;top:46%;width:260px;height:260px;margin:-130px 0 0 -130px;perspective:1100px}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(22deg);cursor:grab;touch-action:none}
.face{position:absolute;inset:0;background:var(--body);border:2px solid #050813;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);padding:10px;backface-visibility:hidden}
.f{transform:translateZ(130px);background:linear-gradient(135deg,#0d1630,#080e22)}
.b{transform:rotateY(180deg) translateZ(130px)}
.r{transform:rotateY(90deg) translateZ(130px);background:linear-gradient(135deg,#091020,#050a18)}
.l{transform:rotateY(-90deg) translateZ(130px)}
.t{transform:rotateX(90deg) translateZ(130px);background:linear-gradient(135deg,#0f1a38,#0a1230)}
.d{transform:rotateX(-90deg) translateZ(130px)}
.c{background:linear-gradient(135deg,#a8f2ff,var(--glow) 55%,var(--glow2));box-shadow:0 0 6px 1px rgba(63,216,255,.9),0 0 18px 4px rgba(26,155,255,.55);margin:1px;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(.82)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sign{position:absolute;left:50%;top:calc(46% + 190px);transform:translateX(-50%);width:max-content;max-width:90vw;text-align:center;padding:10px 18px;background:linear-gradient(#0d1630,#070c1e);border:3px solid #3fd8ff;box-shadow:0 0 14px rgba(63,216,255,.8),inset 0 0 10px rgba(63,216,255,.35);color:#c9f7ff;font:700 16px/1.3 Courier New,monospace;text-shadow:0 0 8px rgba(63,216,255,.9)}
.sign small{display:block;margin-top:4px;font-size:12px;color:#7fdcff}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,4,16,.72);z-index:20;padding:20px}
.modal.on{display:flex}
.card{width:min(380px,100%);text-align:center;padding:26px 22px;background:linear-gradient(#0d1630,#070c1e);border:4px solid #3fd8ff;box-shadow:0 0 30px rgba(63,216,255,.8),inset 0 0 16px rgba(63,216,255,.3);color:#e4fbff;font-family:Courier New,monospace}
.card h2{margin:0 0 18px;font-size:22px;line-height:1.25;text-shadow:0 0 10px rgba(63,216,255,.9)}
.btns{display:flex;gap:16px;justify-content:center;min-height:48px}
.btns button{font:700 16px Courier New,monospace;padding:12px 22px;border:3px solid #3fd8ff;background:#0b1a3a;color:#c9f7ff;cursor:pointer;transition:transform .15s}
.btns button:hover,.btns button:focus-visible{background:#3fd8ff;color:#04101f;outline:none}
@media (max-width:520px){.scene{transform:scale(.8)}.sign{top:calc(46% + 170px);font-size:14px}.card h2{font-size:19px}}
@media (prefers-reduced-motion:reduce){.c{animation:none}}
</style>
</head>
<body>
<div class="halo"></div>
<div class="scene"><div class="cube" id="cube">
<div class="face f" data-p="..........|.##.......|###.####..|....###...|.#........|.###..##..|.....###..|##..#.....|.###..###.|.........."></div>
<div class="face r" data-p="..........|..##......|.####..#..|...##.###.|.......##.|.##.......|.####.###.|..##..##..|.......#..#|.####....."></div>
<div class="face t" data-p=".#####....|..###.##..|.#.......#.|...#####..|.##...###.|.......#..|..####.##.|.#.......#|...##.....|.........."></div>
<div class="face b" data-p="..#..|.###.|..#.."></div>
<div class="face l" data-p="..#..|.###.|..#.."></div>
<div class="face d"></div>
</div></div>
<canvas id="fx"></canvas>
<div class="sign">Gira varias veces el cubo<small id="cnt">Giros: 0 / 3</small></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="q"><div class="card"></div>
  <h2 id="q">¿Aceptarías jugar Minecraft conmigo?</h2>
  <div class="btns"><button id="yes">Sí</button><button id="no">No</button></div>
</div></div>

<script>
// Huecos luminosos de cada cara (cuadrícula 10x10)
document.querySelectorAll('.face[data-p]').forEach(function(face){
  var rows=face.dataset.p.split('|');
  for(var y=0;y<10;y++){
    var row=rows[y]||'';
    for(var x=0;x<10;x++){
      var d=document.createElement('div');
      if(row[x]==='#'){d.className='c';d.style.animationDelay=(((x*7+y*3)%10)*0.3)+'s'}
      face.appendChild(d);
    }
  }
});
</script>
<script src="particulas.js"></script>
<script src="pcubo.js"></script>
</body>
</html>
